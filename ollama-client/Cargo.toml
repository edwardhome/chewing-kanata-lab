[package]
name = "ollama-client"
version = "0.1.0"
edition = "2021"
description = "Bounded blocking HTTP transport for local Ollama loopback endpoint (worker-thread use only)"
license = "MIT OR Apache-2.0"

[lib]
name = "ollama_client"

[dependencies]
# ureq 3.x: synchronous, no async runtime, TLS opt-in; we use plain HTTP only
# (loopback endpoint is always 127.0.0.1 – TLS is not applicable and disabled).
ureq = { version = "3.5", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# tiny_http: minimal synchronous HTTP server used for local fake-server tests.
tiny_http = "0.12"
