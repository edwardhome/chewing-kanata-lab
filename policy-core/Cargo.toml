[package]
name = "chewing-policy-core"
version = "0.1.0"
edition = "2021"
description = "Cross-platform character output policy library for Chewing + Kanata"
license = "MIT OR Apache-2.0"

[lib]
name = "chewing_policy_core"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
unicode-general-category = "0.6"
fs2 = "0.4"
tempfile = "3"
